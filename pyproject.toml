[project]
name = "object-detection"
version = "0.1.0"
description = "Real-time object detection using YOLO and ONNX Runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    # GPU (DirectML) build of ONNX Runtime. Do NOT also add plain "onnxruntime":
    # both install into the same folder and overwrite each other.
    "onnxruntime-directml>=1.24.4",
    "onnx>=1.23.2",
    "opencv-python>=5.0.0.93",
    # Only needed for training/exporting locally (training runs in Colab).
    "ultralytics>=8.4.190",
]
